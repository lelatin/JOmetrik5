name: Mise à jour des actualités
on:
  schedule: [{ cron: "7 * * * *" }]    # toutes les heures
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests && python scraper/scrape.py --news
      - name: Commit
        run: |
          git config user.name "jometrik-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet && exit 0
          git commit -m "data: news $(date -u +%FT%H:%M)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
