name: Mise à jour des prix
on:
  schedule: [{ cron: "17 3 * * *" }]   # tous les jours à 03:17 UTC
  workflow_dispatch:
    inputs:
      only:  { description: "Filtrer par nom de jeu (optionnel)", required: false }
      limit: { description: "Nombre max de jeux (optionnel)", required: false }
permissions: { contents: write }
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: scraper/requirements.txt }
      - uses: browser-actions/setup-chrome@v1
        with: { chrome-version: stable, install-chromedriver: true }
      - run: pip install -r scraper/requirements.txt
      - name: Scrape
        run: |
          python scraper/scrape.py --prices \
            ${{ inputs.only != '' && format('--only "{0}"', inputs.only) || '' }} \
            ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }}
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "jometrik-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "data: prix $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
