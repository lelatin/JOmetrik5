<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23AAFF00'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-size='14' font-weight='800' text-anchor='middle'%3EJO%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="JOMetrik — Game Price Tracker"><meta property="og:description" content="Compare les prix des clés de jeux sur 7 boutiques.">
<meta name="color-scheme" content="dark">
<meta name="description" content="JOMetrik : compare les prix des clés de jeux sur 7 boutiques et 4 plateformes.">
<title>JOMetrik — Game Price Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--neon:#AAFF00;--neon-dim:#AAFF0018;--neon-glow:#AAFF0055;--bg:#0A0A0A;--surface:#111;--card:#161616;--border:#232323;--text:#F2F2F2;--muted:#8c8c8c;--orange:#FF6B00;--red:#e63946;
--ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;scrollbar-color:#333 var(--bg)}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.num,.t-price,.oc-price,.oc-price-orig,.ghc-p-value{font-variant-numeric:tabular-nums}
button,.chip,.plat-tab,.promo-tab,a{touch-action:manipulation}
button,.chip,.plat-tab,.promo-tab,.btn-icon,.btn-buy,.oc-cta,.news-src-pill{-webkit-user-select:none;user-select:none}
button{font:inherit}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Interactions : propriétés explicites, :active partout, hover réservé aux appareils qui survolent */
.btn-icon,.chip,.plat-tab,.promo-tab,.btn-buy,.btn-follow{transition:transform 160ms var(--ease-out),background-color 160ms ease,border-color 160ms ease,color 160ms ease}
.btn-icon:active,.chip:active,.plat-tab:active,.promo-tab:active,.btn-buy:active,.btn-follow:active,.oc-cta:active{transform:scale(.97)}
.offer-card,.news-card{transition:transform 200ms var(--ease-out),border-color 200ms ease}
.offer-card:active,.news-card:active{transform:scale(.98)}

.topbar{position:sticky;top:0;z-index:300;display:flex;align-items:center;gap:16px;height:54px;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left));background:var(--surface);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0}
.logo-box{width:34px;height:34px;border-radius:8px;background:var(--neon);display:flex;align-items:center;justify-content:center;font:800 13px 'Syne',sans-serif;color:#000}
.logo-name{font:800 17px 'Syne',sans-serif;letter-spacing:-.3px}
.topbar-search{flex:1;max-width:580px;margin:0 auto;position:relative;min-width:0}
.topbar-search input{width:100%;padding:8px 36px;background:#1c1c1c;border:1px solid var(--border);border-radius:8px;color:var(--text);font:13px 'Space Grotesk',sans-serif;transition:border-color 200ms ease}
.topbar-search input:focus{border-color:rgba(170,255,0,.4)}
.topbar-search input::placeholder{color:var(--muted)}
.topbar-search input::-webkit-search-cancel-button{display:none}
.ts-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.ts-slash{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:4px;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);pointer-events:none}
#suggestions-box{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;z-index:400;box-shadow:0 20px 50px rgba(0,0,0,.85);transform-origin:top center}
#suggestions-box.open{display:block;animation:pop 160ms var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}}
.sg-item{padding:11px 16px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-item:last-child{border-bottom:0}
.sg-item[aria-selected=true]{background:#1e1e1e}
.topbar-right{display:flex;align-items:center;gap:14px;flex-shrink:0;font-size:12px;color:var(--muted)}
.live-pill{display:none;align-items:center;gap:6px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.btn-icon{width:36px;height:36px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--muted);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.ticker-wrap{display:flex;align-items:center;height:34px;overflow:hidden;background:#0d0d0d;border-bottom:1px solid var(--border)}
.ticker-label{flex-shrink:0;height:100%;display:flex;align-items:center;padding:0 14px;background:var(--neon);color:#000;font-size:10px;font-weight:700;letter-spacing:2px}
.ticker-track{flex:1;overflow:hidden}
.ticker-inner{display:inline-flex;white-space:nowrap;animation:ticker 35s linear infinite;will-change:transform}
@keyframes ticker{to{transform:translateX(-50%)}}
.t-item{display:inline-flex;align-items:center;gap:10px;padding:0 28px;font-size:12px;color:#bbb}
.t-game{color:var(--text);font-weight:600}
.t-badge{padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;background:rgba(170,255,0,.13);border:1px solid rgba(170,255,0,.3);color:var(--neon)}
.t-price{font-weight:700}.t-store{color:var(--muted)}

.page{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:calc(100vh - 88px);min-height:calc(100dvh - 88px)}
.col-main{border-right:1px solid var(--border);padding:20px}
.col-news{padding:20px 18px}
.news-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.news-col-title{font-size:13px;font-weight:700}
.news-sources-pills{display:flex;gap:5px}
.news-src-pill{padding:4px 9px;border-radius:20px;font-size:10px;font-weight:700;text-decoration:none;color:#fff}
.news-card{display:block;text-decoration:none;color:inherit;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--card);margin-bottom:10px}
.news-card-img{width:100%;height:120px;position:relative;overflow:hidden;background:#1a1a1a}
.news-card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 300ms var(--ease-out)}
.news-card-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.news-card-badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.5px;color:#fff}
.news-card-img-fade{position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(transparent,var(--card))}
.news-card-yt-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);font-size:24px;opacity:0;transition:opacity 180ms ease}
.news-card-body{padding:10px 12px 12px}
.news-card-title{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:6px;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
.news-card-source{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.news-card-dot{width:6px;height:6px;border-radius:50%}
.skeleton{background:linear-gradient(90deg,var(--card) 25%,#1e1e1e 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:14px}
.news-skeleton{height:170px;margin-bottom:10px;border-radius:10px}
.shimmer{height:280px}
@keyframes sh{to{background-position:-200% 0}}

#hero-initial{text-align:center;padding:72px 20px 48px}
.hero-title{font:800 clamp(30px,6vw,44px)/1.05 'Syne',sans-serif;letter-spacing:-1.5px;margin-bottom:12px;text-wrap:balance}
.accent{color:var(--neon);text-shadow:0 0 32px var(--neon-glow)}
.hero-sub{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:24px}
.chip{padding:8px 15px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:12px;border-radius:20px;cursor:pointer}
#game-section{display:none}
.game-hero-card{position:relative;border-radius:14px;overflow:hidden;margin-bottom:24px;border:1px solid #2a2a2a;min-height:280px;background:#111}
#ghc-bg-wrap{position:absolute;inset:0}
#ghc-bg-wrap img{width:100%;height:100%;object-fit:cover;filter:brightness(.28) saturate(1.1);animation:fade 300ms var(--ease-out)}
@keyframes fade{from{opacity:0}}
.ghc-gradient{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.93),rgba(0,0,0,.72) 50%,rgba(0,0,0,.1))}
.ghc-content{position:relative;display:flex;gap:24px;padding:26px 28px;min-height:280px}
.ghc-cover{flex-shrink:0;width:120px;border-radius:10px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.7);align-self:center}
.ghc-cover img{width:100%;display:block}
.ghc-cover-ph{flex-shrink:0;width:120px;height:168px;border-radius:10px;background:#1e1e1e;align-self:center}
.ghc-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ghc-tags{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ghc-tag{padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:1px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);color:rgba(255,255,255,.75);text-transform:uppercase}
.ghc-name{font:800 clamp(22px,3vw,26px)/1.1 'Syne',sans-serif;margin-bottom:5px;overflow-wrap:anywhere;text-wrap:balance}
.ghc-meta{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.5px;text-transform:uppercase;margin-bottom:16px}
.ghc-prices{display:flex;gap:24px;margin-bottom:14px;flex-wrap:wrap}
.ghc-p-label{font-size:10px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.5);text-transform:uppercase;margin-bottom:3px}
.ghc-p-value{font:800 22px/1 'Syne',sans-serif;white-space:nowrap}
.ghc-p-sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:4px}
.ghc-eco .ghc-p-value{color:var(--orange)}.ghc-eco .ghc-p-sub{color:rgba(255,107,0,.8)}
.ghc-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn-buy,.btn-follow{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;font-weight:700;font-size:13px;border-radius:8px;cursor:pointer;text-decoration:none}
.btn-buy{background:var(--neon);color:#000;border:0}
.btn-follow{background:transparent;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.75);font-weight:400}
.ghc-chart-wrap{position:absolute;right:24px;bottom:20px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ghc-chart-label{font-size:9px;color:rgba(255,255,255,.45);letter-spacing:1.5px;text-transform:uppercase}

.offers-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.offers-title-wrap{display:flex;align-items:center;gap:12px}
.offers-title{font-size:16px;font-weight:700}
.live-count-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(170,255,0,.08);border:1px solid rgba(170,255,0,.25);color:var(--neon)}
.scraped-at{font-size:11px;color:var(--muted)}
.plat-tabs-wrap{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.plat-tab,.promo-tab{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
.tab-count{font-size:11px;font-weight:700;background:rgba(255,255,255,.07);padding:0 5px;border-radius:4px}
.plat-tab[aria-pressed=true]{background:var(--neon);color:#000;border-color:var(--neon)}
.plat-tab[aria-pressed=true] .tab-count{background:rgba(0,0,0,.15)}
.promo-tab[aria-pressed=true]{background:rgba(255,107,0,.15);border-color:rgba(255,107,0,.4);color:var(--orange)}
.sort-wrap{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-left:auto}
.sort-select{padding:7px 10px;background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text);font:12px 'Space Grotesk',sans-serif;cursor:pointer}

#offers-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.offer-card{border-radius:14px;overflow:hidden;border:1px solid var(--border);display:flex;flex-direction:column;text-decoration:none;color:inherit;position:relative}
.offer-card.enter{animation:up 240ms var(--ease-out) both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.oc-top{position:relative;height:160px;overflow:hidden}
.oc-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.oc-gradient,.oc-store-centered{position:absolute;inset:0}
.oc-fade-bottom{position:absolute;inset:auto 0 0;height:60%;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.oc-store-centered{display:flex;align-items:center;justify-content:center;font:800 21px 'Syne',sans-serif;color:rgba(255,255,255,.92);text-shadow:0 2px 10px rgba(0,0,0,.6)}
.oc-badge-best,.oc-badge-disc{position:absolute;top:12px;z-index:2;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700}
.oc-badge-best{left:12px;background:var(--neon);color:#000}
.oc-badge-disc{right:12px;background:rgba(230,57,70,.92);color:#fff}
.oc-body{padding:14px 14px 16px;background:var(--card);flex:1;display:flex;flex-direction:column}
.oc-store-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:8px}
.oc-store-pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;min-width:0}
.oc-store-icon{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.oc-disc-pill{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;background:rgba(230,57,70,.15);border:1px solid rgba(230,57,70,.3);color:#ff6b75}
.oc-price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.oc-price{font:800 18px 'Syne',sans-serif;white-space:nowrap}
.oc-price-orig{font-size:12px;color:var(--muted);text-decoration:line-through;white-space:nowrap}
.oc-plat-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}
.oc-key-type{font-size:11px;color:var(--muted)}
.oc-plat-label{font-size:10px;font-weight:700;letter-spacing:1px}
.oc-cta{display:flex;align-items:center;justify-content:center;padding:11px;background:var(--neon);color:#000;font-weight:700;font-size:13px;border-radius:8px;margin-top:auto;transition:transform 160ms var(--ease-out),background-color 160ms ease}
.error-box{padding:16px;margin-bottom:20px;background:#1a0808;border:1px solid #4a1515;border-radius:10px;color:#ff8a8a;font-size:13px}
.oc-sim{margin-left:4px;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.08);color:#c9c9c9}
button.t-item{background:none;border:0;font:inherit;cursor:pointer;color:#bbb}
.empty{color:var(--muted);padding:40px 0;text-align:center;font-size:14px;grid-column:1/-1}

@media (hover:hover) and (pointer:fine){
 .btn-icon:hover{border-color:var(--neon);color:var(--neon)}
 .chip:hover{border-color:rgba(170,255,0,.5);color:var(--neon);background:var(--neon-dim)}
 .plat-tab:not([aria-pressed=true]):hover{border-color:rgba(170,255,0,.35);color:var(--text)}
 .promo-tab:not([aria-pressed=true]):hover{border-color:rgba(255,107,0,.3);color:var(--orange)}
 .btn-buy:hover,.oc-cta:hover{background:#c8ff33}
 .btn-follow:hover{border-color:rgba(255,255,255,.4);color:#fff}
 .offer-card:hover{transform:translateY(-3px);border-color:#333}
 .news-card:hover{transform:translateY(-2px);border-color:#333}
 .news-card:hover img{transform:scale(1.03)}.news-card:hover .news-card-yt-play{opacity:1}
 .sg-item:hover{background:#1e1e1e}.ticker-inner:hover{animation-play-state:paused}
 .news-src-pill:hover{opacity:.8}
}
@media (pointer:coarse){input,select{font-size:16px!important}.ts-slash{display:none}}
@media (max-width:1100px){#offers-grid{grid-template-columns:repeat(2,1fr)}.page{grid-template-columns:minmax(0,1fr) 280px}}
@media (max-width:900px){.page{grid-template-columns:1fr}.col-main{border-right:0}.ghc-chart-wrap{display:none}}
@media (max-width:640px){#offers-grid{grid-template-columns:1fr}.topbar{gap:10px}.logo-name{display:none}.ghc-content{padding:16px;gap:14px}.ghc-cover,.ghc-cover-ph{width:86px}.ghc-cover-ph{height:120px}.col-main{padding:14px}}
@media (prefers-reduced-motion:reduce){
 .ticker-inner{animation:none}.ticker-track{overflow-x:auto}.live-dot,.skeleton{animation:none}
 .offer-card.enter,#suggestions-box.open,#ghc-bg-wrap img{animation:none}.news-card{animation:none}
}
</style>
</head>
<body>
<noscript><p style="padding:20px">JOMetrik a besoin de JavaScript pour afficher les prix.</p></noscript>
<header class="topbar">
 <div class="logo"><div class="logo-box" aria-hidden="true">JO</div><span class="logo-name">JOMetrik</span></div>
 <form class="topbar-search" role="search" id="search-form" onsubmit="return false">
  <span class="ts-icon" aria-hidden="true">🔍</span>
  <label for="search-input" class="sr-only">Rechercher un jeu</label>
  <input type="search" id="search-input" placeholder="Rechercher un jeu — Cyberpunk, Hollow Knight, Hades…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" role="combobox" aria-expanded="false" aria-controls="suggestions-box" aria-autocomplete="list">
  <div class="ts-slash" aria-hidden="true">/</div>
  <div id="suggestions-box" role="listbox"></div>
 </form>
 <div class="topbar-right">
   <button class="btn-icon" id="refresh" type="button" aria-label="Rafraîchir les prix">↺</button>
 </div>
</header>
<div class="ticker-wrap" aria-label="Meilleures réductions">
 <div class="ticker-label">⚡ TOP DROPS</div>
 <div class="ticker-track"><div class="ticker-inner" id="ticker-inner"></div></div>
</div>
<div class="page">
 <main class="col-main">
  <div id="error-box" class="error-box" role="alert" hidden></div>
  <section id="hero-initial">
   <h1 class="hero-title">Trouve le <span class="accent">meilleur prix</span></h1>
   <p class="hero-sub">7 boutiques · 4 plateformes · clés de jeux · prix mis à jour chaque jour</p>
   <div class="chips" id="chips"></div>
  </section>
  <section id="game-section">
   <div class="game-hero-card">
    <div id="ghc-bg-wrap"></div><div class="ghc-gradient"></div>
    <div class="ghc-content">
     <div id="ghc-cover-wrap"><div class="ghc-cover-ph"></div></div>
     <div class="ghc-info">
      <div class="ghc-tags" id="ghc-tags"></div>
      <h2 class="ghc-name" id="ghc-name">—</h2>
      <div class="ghc-meta" id="ghc-meta">Chargement…</div>
      <div class="ghc-prices" aria-live="polite">
       <div><div class="ghc-p-label">Meilleur prix</div><div class="ghc-p-value" id="ghc-price">—</div><div class="ghc-p-sub" id="ghc-store">—</div></div>
       <div class="ghc-eco" id="ghc-eco-block" hidden><div class="ghc-p-label">Économie</div><div class="ghc-p-value" id="ghc-eco-val">—</div><div class="ghc-p-sub" id="ghc-eco-ref"></div></div>
      </div>
      <div class="ghc-actions">
       <a href="#" id="ghc-btn-buy" class="btn-buy" target="_blank" rel="noopener noreferrer">↗ Acheter sur <span id="ghc-btn-store">—</span></a>
       <button class="btn-follow" type="button">☆ Suivre</button>
      </div>
     </div>
    </div>
    <div class="ghc-chart-wrap"><div class="ghc-chart-label" id="ghc-chart-label">Historique</div><canvas id="price-chart" width="220" height="70" role="img" aria-label="Courbe indicative des prix"></canvas></div>
   </div>
   <div class="offers-header">
    <div class="offers-title-wrap"><h2 class="offers-title">Toutes les offres</h2>
     <span class="live-count-badge"><span id="offer-count" class="num">0</span> OFFRES</span></div>
    <div class="scraped-at" id="scraped-at"></div>
   </div>
   <div class="plat-tabs-wrap" id="tabs">
    <button class="plat-tab" type="button" data-plat="all" aria-pressed="true">Tous <span class="tab-count num" id="tab-all">0</span></button>
    <button class="plat-tab" type="button" data-plat="PC" aria-pressed="false">PC <span class="tab-count num" id="tab-PC">0</span></button>
    <button class="plat-tab" type="button" data-plat="Xbox" aria-pressed="false">Xbox <span class="tab-count num" id="tab-Xbox">0</span></button>
    <button class="plat-tab" type="button" data-plat="PlayStation" aria-pressed="false">PlayStation <span class="tab-count num" id="tab-PlayStation">0</span></button>
    <button class="plat-tab" type="button" data-plat="Nintendo" aria-pressed="false">Nintendo <span class="tab-count num" id="tab-Nintendo">0</span></button>
    <button class="promo-tab" type="button" id="promo-btn" aria-pressed="false">🔥 Promo &gt;30%</button>
    <label class="sort-wrap">TRIER
     <select class="sort-select" id="sort-sel"><option value="price-asc">Prix croissant</option><option value="price-desc">Prix décroissant</option><option value="discount-desc">Meilleure réduction</option></select></label>
   </div>
   <div id="offers-grid"></div>
  </section>
 </main>
 <aside class="col-news" id="col-news" aria-label="Actualités">
  <div class="news-col-head"><h2 class="news-col-title">📰 Actualités</h2>
   <div class="news-sources-pills">
    <a href="https://www.xboxygen.com" target="_blank" rel="noopener noreferrer" class="news-src-pill" style="background:#3f8a33" aria-label="Xboxygen">XB</a>
    <a href="https://www.actugaming.net" target="_blank" rel="noopener noreferrer" class="news-src-pill" style="background:#c9303c" aria-label="ActuGaming">AG</a>
    <a href="https://www.youtube.com/@Origatube/videos" target="_blank" rel="noopener noreferrer" class="news-src-pill" style="background:#d40000" aria-label="Origatube sur YouTube">YT</a>
   </div></div>
  <div id="news-feed"></div>
 </aside>
</div>
<script>
/* GitHub Pages : /api/* → data/index.json, data/prices/<slug>.json, data/news.json */
(()=>{const rf=window.fetch.bind(window),memo={};
const slug=s=>s.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const ok=r=>{if(!r.ok)throw new Error(r.status===404?"404":r.url+" → "+r.status);return r.json()};
const load=(p,f)=>f?rf(p+"?v="+Date.now()).then(ok):memo[p]||(memo[p]=rf(p+"?v="+Math.floor(Date.now()/6e5)).then(ok).catch(e=>{delete memo[p];throw e}));
const reply=(b,s=200)=>Promise.resolve(new Response(JSON.stringify(b),{status:s,headers:{"Content-Type":"application/json"}}));
window.fetch=(url,o)=>{if(typeof url!=="string"||!url.startsWith("/api/"))return rf(url,o);
const u=new URL(url,location.href),q=u.searchParams,force=q.has("force");
if(u.pathname==="/api/index")return load("data/index.json").then(reply).catch(()=>reply({games:[]},500));
if(u.pathname==="/api/suggestions"){const s=(q.get("q")||"").trim().toLowerCase();
return load("data/index.json").then(d=>s.length<2?[]:d.games.map(g=>g.n).filter(n=>n.toLowerCase().includes(s)).sort((a,b)=>(!a.toLowerCase().startsWith(s)-!b.toLowerCase().startsWith(s))||a.localeCompare(b)).slice(0,8)).then(reply).catch(()=>reply([]))}
if(u.pathname==="/api/news")return load("data/news.json",force).then(reply).catch(()=>reply({error:"news indisponibles",sources:{}},500));
if(u.pathname==="/api/prices"){const game=(q.get("game")||"").trim();
return load("data/prices/"+slug(game)+".json",force).then(g=>reply({game:g.name,entries:g.entries,image:g.image||"",history:g.history||[],cached_at:g.scraped_at}))
.catch(e=>e.message==="404"?reply({error:"Jeu non suivi : choisissez un jeu dans les suggestions."},404):reply({error:"Données indisponibles, réessayez plus tard."},500))}
return reply({error:"route inconnue"},404)}})();
</script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n.toFixed(2).replace(".",",")+" €";
const safeUrl=u=>/^https?:\/\//i.test(u)?u:"#";
const POPULAR=["Cyberpunk 2077","Elden Ring","God of War","Red Dead Redemption 2","The Witcher 3: Wild Hunt","GTA V","Hogwarts Legacy","Baldur's Gate 3","Helldivers 2","Stardew Valley"];
const G=(a,b,c)=>`linear-gradient(135deg,${a} 0%,${b} 55%,${c} 100%)`;
const STORE={"Instant Gaming":{g:G("#8B0000","#c0392b","#e74c3c"),i:"IG",bg:"#a93226",c:"#ff8a80"},"Eneba":{g:G("#7d3000","#d4520a","#e67e22"),i:"EN",bg:"#c0392b",c:"#ffab76"},"Kinguin":{g:G("#5d2e00","#a0522d","#cd853f"),i:"KG",bg:"#8b4513",c:"#ffd166"},"Steam":{g:G("#0d2137","#1a4060","#2980b9"),i:"ST",bg:"#1a3a5c",c:"#66c0f4"},"GOG":{g:G("#2d0060","#6a1a9a","#9b59b6"),i:"GO",bg:"#5a108f",c:"#c47fff"},"Epic Games":{g:G("#0a0a0a","#1a1a1a","#2c2c2c"),i:"EP",bg:"#222",c:"#c5c5c5"},"Xbox":{g:G("#0a2d0e","#145a1e","#27ae60"),i:"XB",bg:"#145a1e",c:"#52b043"}};
const PLAT={PC:{icon:"🖥️",color:"#63b3ed",label:"PC"},PlayStation:{icon:"🎮",color:"#4a90d9",label:"PLAYSTATION"},Xbox:{icon:"🟢",color:"#52b043",label:"XBOX"},Nintendo:{icon:"🔴",color:"#ff4d58",label:"NINTENDO"}};
const NEWS={xboxygen:{name:"Xboxygen",color:"#52b043",icon:"XB"},actugaming:{name:"ActuGaming",color:"#e63946",icon:"AG"},youtube:{name:"Origatube",color:"#ff0000",icon:"YT"}};
let all=[],game="",img="",plat="all",promo=false,reqId=0,newsT=null;
const inp=$("search-input");

document.addEventListener("DOMContentLoaded",()=>{
 $("chips").innerHTML=POPULAR.map(g=>`<button type="button" class="chip" data-g="${esc(g)}">${esc(g)}</button>`).join("");
 $("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){inp.value=b.dataset.g;doSearch()}});
 inp.addEventListener("input",onInput);
 inp.addEventListener("keydown",onKey);
 inp.addEventListener("blur",()=>setTimeout(hideSug,160));
 $("tabs").addEventListener("click",e=>{const t=e.target.closest(".plat-tab");if(!t)return;
  plat=t.dataset.plat;document.querySelectorAll(".plat-tab").forEach(x=>x.setAttribute("aria-pressed",x===t));renderOffers()});
 $("promo-btn").addEventListener("click",function(){promo=!promo;this.setAttribute("aria-pressed",promo);renderOffers()});
 $("sort-sel").addEventListener("change",()=>renderOffers());
 $("refresh").addEventListener("click",()=>{doSearch(true);loadNews(true)});
 $("suggestions-box").addEventListener("mousedown",e=>{const s=e.target.closest(".sg-item");if(s){e.preventDefault();pick(s.dataset.g)}});
 /* Raccourci clavier : jamais animé */
 document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();inp.focus()}});
 inp.value=new URLSearchParams(location.search).get("jeu")||"Cyberpunk 2077";doSearch();loadNews();loadTicker();
});

async function doSearch(force=false){
 const name=inp.value.trim();if(!name)return;hideSug();
 const id=++reqId;game=name;img="";
 $("hero-initial").hidden=true;$("game-section").style.display="block";$("error-box").hidden=true;
 $("ghc-name").textContent=name;$("ghc-meta").textContent="Chargement des offres…";$("ghc-price").textContent="…";
 $("ghc-eco-block").hidden=true;$("ghc-bg-wrap").innerHTML="";$("ghc-cover-wrap").innerHTML='<div class="ghc-cover-ph"></div>';
 $("offers-grid").innerHTML='<div class="skeleton shimmer"></div>'.repeat(6);$("offer-count").textContent="…";
 try{
  const json=await fetch(`/api/prices?game=${encodeURIComponent(name)}${force?"&force=1":""}`).then(r=>r.json());
  if(id!==reqId)return; /* réponse périmée : on l'ignore */
  if(json.error)throw new Error(json.error);
  all=json.entries||[];img=json.image||"";
  if(img)$("ghc-bg-wrap").innerHTML=`<img src="${esc(img)}" alt="" decoding="async" onerror="this.remove()">`;
  renderHero(json);updateTabs();renderOffers(true);
  const real=all.filter(e=>!e.simulated).length;
  $("scraped-at").textContent=(json.cached_at?"Mis à jour le "+new Date(json.cached_at).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}):"")+(real?"":" · prix estimés");
  history.replaceState(null,"","?jeu="+encodeURIComponent(name));
 }catch(e){if(id!==reqId)return;$("error-box").textContent="Erreur : "+e.message;$("error-box").hidden=false;$("offers-grid").innerHTML=""}
}

function renderHero(json){
 const avail=all.filter(e=>e.available),name=json.game||game;
 $("ghc-name").textContent=name;
 $("ghc-meta").textContent=`${all.length} offres · ${new Set(all.map(e=>e.store)).size} vendeurs · ${all.filter(e=>!e.simulated).length} prix vérifiés`;
 $("ghc-tags").innerHTML=[...new Set(avail.map(e=>e.platform))].map(p=>`<span class="ghc-tag">${PLAT[p]?.icon||""} ${esc(p)}</span>`).join("");
 if(!avail.length){$("ghc-price").textContent="—";$("ghc-store").textContent="Aucune offre disponible";return}
 const real=avail.filter(e=>!e.simulated),pool=real.length?real:avail,best=pool.reduce((a,b)=>a.price<b.price?a:b),max=Math.max(...pool.map(e=>e.price));
 $("ghc-price").textContent=fmt(best.price);
 $("ghc-store").textContent=`chez ${best.store} · ${PLAT[best.platform]?.icon||""} ${best.platform} · ${best.type||"Key"}${real.length?"":" · estimation"}`;
 $("ghc-btn-buy").href=safeUrl(best.url);$("ghc-btn-store").textContent=best.store;
 if(img)$("ghc-cover-wrap").innerHTML=`<div class="ghc-cover"><img src="${esc(img)}" alt="Jaquette de ${esc(name)}" decoding="async" onerror="this.parentElement.remove()"></div>`;
 const diff=max-best.price;
 if(diff>.5){$("ghc-eco-block").hidden=false;$("ghc-eco-val").textContent="−"+fmt(diff);$("ghc-eco-ref").textContent="vs prix max ("+fmt(max)+")"}
 drawHistory(json.history||[]);
}

function drawHistory(h){
 const wrap=document.querySelector(".ghc-chart-wrap");wrap.hidden=h.length<2;if(h.length<2)return;
 const c=$("price-chart"),x=c.getContext("2d"),W=c.width,H=c.height,p=h.map(r=>r[1]),n=p.length;
 $("ghc-chart-label").textContent=`Historique · ${n} relevés`;x.clearRect(0,0,W,H);
 const lo=Math.min(...p)*.97,hi=Math.max(...p)*1.03,Y=v=>H-((v-lo)/(hi-lo+.001))*(H-4)-2,X=i=>i/(n-1)*W;
 const path=()=>{x.beginPath();x.moveTo(X(0),Y(p[0]));for(let i=1;i<n;i++)x.lineTo(X(i),Y(p[i]))};
 path();x.lineTo(W,H);x.lineTo(0,H);x.closePath();
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"rgba(170,255,0,.3)");g.addColorStop(1,"rgba(170,255,0,0)");x.fillStyle=g;x.fill();
 path();x.strokeStyle="#AAFF00";x.lineWidth=2;x.lineJoin=x.lineCap="round";x.stroke();
 x.beginPath();x.arc(X(n-1),Y(p[n-1]),3.5,0,7);x.fillStyle="#AAFF00";x.fill();
}

function updateTabs(){
 const a=all.filter(e=>e.available);$("tab-all").textContent=a.length;
 ["PC","Xbox","PlayStation","Nintendo"].forEach(p=>$("tab-"+p).textContent=a.filter(e=>e.platform===p).length);
}

/* animate=true uniquement après une recherche : filtres et tris sont instantanés */
function renderOffers(animate=false){
 let items=all.filter(e=>e.available);
 if(plat!=="all")items=items.filter(e=>e.platform===plat);
 if(promo)items=items.filter(e=>(e.discount||0)>=30);
 const s=$("sort-sel").value;
 items.sort(s==="price-desc"?(a,b)=>b.price-a.price:s==="discount-desc"?(a,b)=>(b.discount||0)-(a.discount||0):(a,b)=>a.price-b.price);
 $("offer-count").textContent=items.length;
 const grid=$("offers-grid");
 if(!items.length){grid.innerHTML='<div class="empty">Aucune offre pour ce filtre</div>';return}
 const rl=items.filter(e=>!e.simulated),best=Math.min(...(rl.length?rl:items).map(e=>e.price));
 grid.innerHTML=items.map((e,i)=>{
  const sc=STORE[e.store]||{g:G("#1a1a1a","#222","#2c2c2c"),i:"··",bg:"#222",c:"#aaa"};
  const pm=PLAT[e.platform]||{color:"#aaa",label:String(e.platform||"").toUpperCase()};
  const orig=e.originalPrice||(e.discount>0?Math.round(e.price/(1-e.discount/100)*100)/100:null);
  const st=esc(e.store);
  return `<a class="offer-card${animate?" enter":""}" href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener noreferrer" ${animate?`style="animation-delay:${Math.min(i,8)*30}ms"`:""}>
  <div class="oc-top">${img?`<img class="oc-bg-img" src="${esc(img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:""}
   <div class="oc-gradient" style="background:${sc.g};${img?"opacity:.7":""}"></div><div class="oc-fade-bottom"></div>
   <div class="oc-store-centered">${st}</div>
   ${e.price===best?'<div class="oc-badge-best">• MEILLEUR PRIX</div>':""}${e.discount>0?`<div class="oc-badge-disc">−${e.discount}%</div>`:""}</div>
  <div class="oc-body">
   <div class="oc-store-row"><div class="oc-store-pill"><div class="oc-store-icon" style="background:${sc.bg}">${sc.i}</div><span style="color:${sc.c}">${st}</span></div>${e.discount>0?`<span class="oc-disc-pill">−${e.discount}%</span>`:""}</div>
   <div class="oc-price-row"><span class="oc-price">${fmt(e.price)}</span>${orig?`<span class="oc-price-orig">${fmt(orig)}</span>`:""}</div>
   <div class="oc-plat-row"><div class="oc-key-type"><span style="color:${e.simulated?"var(--muted)":"var(--neon)"}">●</span> ${esc(e.type||e.platform+" Key")}${e.simulated?' <span class="oc-sim" title="Prix non vérifié : boutique indisponible au dernier scrape">ESTIMATION</span>':""}</div><span class="oc-plat-label" style="color:${pm.color}">${esc(pm.label)}</span></div>
   <div class="oc-cta">Voir l'offre ↗</div></div></a>`}).join("");
}

async function loadTicker(){
 try{const d=await fetch("/api/index").then(r=>r.json());
  const it=d.games.filter(g=>g.drop).sort((a,b)=>b.drop.discount-a.drop.discount).slice(0,12);if(!it.length)return;
  const mk=h=>it.map(g=>`<button type="button" class="t-item" data-g="${esc(g.n)}"${h?' aria-hidden="true" tabindex="-1"':""}><span class="t-game">${esc(g.n)}</span><span class="t-badge">−${g.drop.discount}%</span><span class="t-price">${fmt(g.drop.price)}</span><span class="t-store">@ ${esc(g.drop.store.toUpperCase())}</span></button>`).join("");
  const t=$("ticker-inner");t.innerHTML=mk()+mk(true);
  t.addEventListener("click",e=>{const b=e.target.closest(".t-item");if(b){inp.value=b.dataset.g;doSearch();scrollTo({top:0})}});
 }catch{}
}
const rtf=new Intl.RelativeTimeFormat("fr",{numeric:"auto"});
function rel(ts){const s=ts-Date.now()/1e3,a=Math.abs(s);
 return a<3600?rtf.format(Math.round(s/60),"minute"):a<86400?rtf.format(Math.round(s/3600),"hour"):rtf.format(Math.round(s/86400),"day")}

async function loadNews(force=false){
 const feed=$("news-feed");
 feed.innerHTML='<div class="skeleton news-skeleton"></div>'.repeat(5);
 try{
  const json=await fetch("/api/news"+(force?"?force=1":"")).then(r=>r.json());if(json.error)throw new Error(json.error);
  const list=[];Object.entries(json.sources||{}).forEach(([sid,s])=>(s?.articles||[]).forEach(a=>list.push({...a,sid})));
  if(!list.length){feed.innerHTML='<div class="empty">Aucune actualité disponible</div>';return}
  list.sort((a,b)=>(b.pub_ts||0)-(a.pub_ts||0));
  feed.innerHTML=list.map((a,i)=>{
   const m=NEWS[a.sid]||{name:a.sid,color:"#666",icon:"?"},yt=a.sid==="youtube",ph=yt?"▶":"📰";
   return `<a class="news-card" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener noreferrer">
   <div class="news-card-img">${a.image?`<img src="${esc(a.image)}" alt="" loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'news-card-img-ph',textContent:'${ph}'}))">${yt?'<div class="news-card-yt-play" aria-hidden="true">▶</div>':""}<div class="news-card-img-fade"></div>`:`<div class="news-card-img-ph">${ph}</div>`}
   <div class="news-card-badge" style="background:${m.color}cc">${m.icon} ${esc(m.name)}</div></div>
   <div class="news-card-body"><div class="news-card-title">${esc(a.title)}</div>
   <div class="news-card-meta"><span class="news-card-source" style="color:${m.color}"><span class="news-card-dot" style="background:${m.color}"></span>${esc(m.name)}</span><span>${a.pub_ts?rel(a.pub_ts):""}</span></div></div></a>`}).join("");
  clearTimeout(newsT);newsT=setTimeout(loadNews,18e5);
 }catch(e){feed.innerHTML='<div class="empty">Actualités indisponibles</div>'}
}


/* Suggestions : navigation clavier (↑ ↓ Entrée Échap) */
let sugT=null,sel=-1;
function onInput(){const v=inp.value;if(v.length<2){hideSug();return}clearTimeout(sugT);sugT=setTimeout(()=>fetchSug(v),200)}
async function fetchSug(v){
 try{const d=await fetch(`/api/suggestions?q=${encodeURIComponent(v)}`).then(r=>r.json());
  if(inp.value!==v)return;if(!d.length){hideSug();return}
  const box=$("suggestions-box");sel=-1;
  box.innerHTML=d.map((g,i)=>{const k=g.toLowerCase().indexOf(v.toLowerCase());
   const h=k>=0?esc(g.slice(0,k))+`<strong style="color:var(--neon)">${esc(g.slice(k,k+v.length))}</strong>`+esc(g.slice(k+v.length)):esc(g);
   return `<div class="sg-item" role="option" id="sg${i}" data-g="${esc(g)}" aria-selected="false">🎮 ${h}</div>`}).join("");
  box.classList.add("open");inp.setAttribute("aria-expanded","true")}catch{hideSug()}
}
function hideSug(){$("suggestions-box").classList.remove("open");inp.setAttribute("aria-expanded","false");sel=-1}
function onKey(e){
 const it=[...document.querySelectorAll(".sg-item")],open=$("suggestions-box").classList.contains("open");
 if(e.key==="ArrowDown"||e.key==="ArrowUp"){if(!open||!it.length)return;e.preventDefault();
  sel=(sel+(e.key==="ArrowDown"?1:-1)+it.length)%it.length;
  it.forEach((x,i)=>x.setAttribute("aria-selected",i===sel));inp.setAttribute("aria-activedescendant","sg"+sel)}
 else if(e.key==="Enter"){if(open&&sel>=0)inp.value=it[sel].dataset.g;doSearch()}
 else if(e.key==="Escape")hideSug();
}
function pick(g){inp.value=g;hideSug();doSearch()}
</script>
